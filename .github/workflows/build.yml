name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настройка JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Установка Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Принятие лицензий Android SDK
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager --update || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 5. Создание local.properties с путём к SDK (критично для сборки)
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "sdk.dir=${ANDROID_HOME}" > app/local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 6. Установка Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      # 7. Сборка Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # 8. Сборка Release APK (без подписи)
      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace --info
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # 9. Загрузка Debug APK как артефакт
      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 10. Загрузка Release APK как артефакт
      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
          fail-on-error: false

      # 11. При создании релиза — прикрепляем APK к релизу
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
