name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      # 1. Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настройка JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Установка необходимых компонентов Android SDK
      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk

      # 4. Создание local.properties
      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/lib/android-sdk" > local.properties
          echo "sdk.dir=/usr/lib/android-sdk" > app/local.properties

      # 5. Установка Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      # 6. Проверка структуры проекта (диагностика)
      - name: Check project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app/
          echo "=== App src ==="
          ls -la app/src/main/ 2>/dev/null || echo "app/src/main not found"
          echo "=== Java sources ==="
          find app/src -name "*.java" 2>/dev/null || echo "No Java files found"
          echo "=== Layout files ==="
          find app/src -name "*.xml" -path "*/layout/*" 2>/dev/null || echo "No layout files found"
          echo "=== AndroidManifest ==="
          find app/src -name "AndroidManifest.xml" 2>/dev/null || echo "No manifest found"
          echo "=== build.gradle files ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null

      # 7. Сборка Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk

      # 8. Сборка Release APK (без подписи)
      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk

      # 9. Загрузка Debug APK как артефакт
      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 10. Загрузка Release APK как артефакт
      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
          fail-on-error: false

      # 11. При создании релиза — прикрепляем APK к релизу
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
