name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настройка JDK 17 (актуально для современных версий Android Studio)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Кэширование Gradle для ускорения сборок
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Предоставление прав на запуск gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Сборка Release APK (без подписи — для тестирования)
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      # 7. Загрузка Debug APK как артефакт (доступен 90 дней)
      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 8. Загрузка Release APK как артефакт (если сборка успешна)
      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
          fail-on-error: false

      # 9. При создании релиза — прикрепляем APK к релизу
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
