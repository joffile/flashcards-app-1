name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Настройка Node.js v20 (требуется для android-actions)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Настройка JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Установка Android SDK (совместимо с Node.js v20)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Принятие лицензий Android SDK
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager --update || true

      # 6. Создание local.properties
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "sdk.dir=${ANDROID_HOME}" > app/local.properties

      # 7. Установка Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      # 8. Проверка структуры проекта
      - name: Check project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app/ 2>/dev/null || echo "app/ not found"
          echo "=== Java sources ==="
          find . -name "*.java" 2>/dev/null || echo "No Java files found"
          echo "=== Layout files ==="
          find . -name "*.xml" -path "*/layout/*" 2>/dev/null || echo "No layout files found"
          echo "=== AndroidManifest ==="
          find . -name "AndroidManifest.xml" 2>/dev/null || echo "No manifest found"
          echo "=== build.gradle files ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null
          echo "=== Android SDK path ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

      # 9. Сборка Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # 10. Сборка Release APK (без подписи)
      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # 11. Загрузка Debug APK как артефакт
      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # 12. Загрузка Release APK как артефакт
      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
          fail-on-error: false

      # 13. При создании релиза — прикрепляем APK к релизу
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
