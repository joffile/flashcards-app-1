name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Diagnostics - project structure
        run: |
          echo "========== ROOT FILES =========="
          ls -la
          echo ""
          echo "========== FULL TREE (depth 6) =========="
          find . -maxdepth 6 -not -path './.git*' | sort
          echo ""
          echo "========== gradle.properties =========="
          cat gradle.properties 2>/dev/null || echo "NOT FOUND - THIS IS THE PROBLEM!"
          echo ""
          echo "========== app/build.gradle =========="
          cat app/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "========== AndroidManifest.xml =========="
          cat app/src/main/AndroidManifest.xml 2>/dev/null || echo "NOT FOUND"

      - name: Build Debug APK
        id: build
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Show FIRST 200 lines of build output
        if: always()
        run: |
          echo "========== FIRST 200 LINES =========="
          head -200 build-output.log
          echo ""
          echo "========== ERRORS =========="
          grep -n -A 15 -E "FAILURE|What went wrong|error:|Error:|Caused by:" build-output.log | head -100 || echo "No errors found"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload APK to Release
        if: github.event_name == 'release' && success()
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
