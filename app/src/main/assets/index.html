<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Английские слова</title>
<style>
:root{--primary:#6750A4;--on-primary:#FFFFFF;--pc:#EADDFF;--on-pc:#21005D;--surface:#FEF7FF;--sc:#F3EDF7;--sch:#E6E0E9;--on-surface:#1D1B20;--ov:#49454F;--outline:#79747E;--sec:#E8DEF8;--osec:#1D192B;--ec:#F9DEDC;--oec:#410E0B;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#D0BCFF;--on-primary:#381E72;--pc:#4F378B;--on-pc:#EADDFF;--surface:#141218;--sc:#211F26;--sch:#2B2930;--on-surface:#E6E0E9;--ov:#CAC4D0;--outline:#938F99;--sec:#4A4458;--osec:#E8DEF8;--ec:#8C1D18;--oec:#F9DEDC;--err:#F2B8B5;color-scheme:dark}}
:root[data-theme="dark"]{--primary:#D0BCFF;--on-primary:#381E72;--pc:#4F378B;--on-pc:#EADDFF;--surface:#141218;--sc:#211F26;--sch:#2B2930;--on-surface:#E6E0E9;--ov:#CAC4D0;--outline:#938F99;--sec:#4A4458;--osec:#E8DEF8;--ec:#8C1D18;--oec:#F9DEDC;--err:#F2B8B5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--on-surface);font:400 16px/24px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--surface);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px}
h1{margin:0 0 12px;font:400 22px/28px Roboto,system-ui,sans-serif}
main{padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 120px)}
.in{width:100%;height:56px;border:1px solid var(--outline);border-radius:4px;background:transparent;color:var(--on-surface);font-size:16px;padding:0 16px;margin-bottom:12px;outline:none}
.top .in{margin:0}
.in:focus{border:2px solid var(--primary);padding:0 15px}
.title{margin:20px 4px 8px;font:500 14px/20px Roboto,system-ui,sans-serif;color:var(--ov)}
.panel{background:var(--sc);border-radius:28px;padding:20px;margin-bottom:12px}
.panel>.title{margin:0 0 12px}
.sub{margin:0 0 12px;color:var(--ov);font-size:14px;line-height:20px}
.small{color:var(--ov);font-size:12px;line-height:16px}
.msg{min-height:20px;margin-top:8px;color:var(--ov);font-size:14px;text-align:center}
.meta{display:flex;justify-content:space-between;color:var(--ov);font-size:14px;margin:8px 4px 10px}
.track{height:4px;border-radius:2px;background:var(--sch);overflow:hidden}
.bar{height:100%;width:0;background:var(--primary);border-radius:2px;transition:width .3s}
.scene{perspective:1200px;margin:16px 0 8px}
.flip{position:relative;min-height:320px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sc);border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.back{transform:rotateY(180deg)}
.label{font:500 12px/16px Roboto,system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:var(--ov)}
.word{font:400 36px/44px Roboto,system-ui,sans-serif;word-break:break-word}
.ru{font:400 28px/36px Roboto,system-ui,sans-serif;color:var(--primary);word-break:break-word}
.ex{font-size:16px;line-height:24px}
.exru{font-size:14px;line-height:20px;color:var(--ov)}
.hint{font-size:12px;color:var(--ov)}
.chip{position:absolute;top:16px;right:16px;height:32px;padding:0 12px;border-radius:8px;background:var(--sec);color:var(--osec);font:500 14px/32px Roboto,system-ui,sans-serif}
.btn{height:40px;padding:0 24px;border:0;border-radius:20px;font:500 14px/20px Roboto,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:active{opacity:.85}
.filled{background:var(--primary);color:var(--on-primary)}
.tonal{background:var(--sec);color:var(--osec)}
.outlined{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.text{background:none;color:var(--primary);padding:0 12px}
.text.red{color:var(--err)}
.wide{display:flex;width:100%;margin-top:8px}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1;height:48px;border-radius:24px;font-size:15px}
.center{display:flex;justify-content:center;margin-top:8px}
.end{text-align:center}
.end h2{margin:0 0 8px;font:400 24px/32px Roboto,system-ui,sans-serif}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sch);border-radius:16px;padding:12px 8px 12px 16px;margin-bottom:8px}
.txt{min-width:0;overflow-wrap:anywhere}
.icon{width:40px;height:40px;border:0;border-radius:20px;background:transparent;color:var(--ov);font-size:18px;cursor:pointer;flex-shrink:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--pc);color:var(--on-pc);border-radius:20px;padding:16px 8px;text-align:center}
.stat b{display:block;font:400 28px/36px Roboto,system-ui,sans-serif}
.stat span{font-size:12px;line-height:16px}
.dname{font:500 16px/24px Roboto,system-ui,sans-serif}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--sc);padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px)}
.ni{flex:1;border:0;background:none;color:var(--ov);font:500 12px/16px Roboto,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0}
.pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.pill svg{width:24px;height:24px;fill:currentColor}
.ni.on{color:var(--on-surface)}
.ni.on .pill{background:var(--pc);color:var(--on-pc)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:6;height:56px;padding:0 20px;border:0;border-radius:16px;background:var(--pc);color:var(--on-pc);font:500 14px Roboto,system-ui,sans-serif;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);cursor:pointer}
.fab svg{width:24px;height:24px;fill:currentColor}
</style>
</head>
<body>
<header class="top">
  <h1>Английские слова</h1>
  <select id="deckSel" class="in" aria-label="Колода"></select>
</header>

<main>
  <section id="panel-study">
    <div id="noWords" class="panel" hidden>
      <p class="sub">В этой колоде пока нет слов.</p>
      <button id="goWords" class="btn filled">Добавить слова</button>
    </div>

    <div id="studyBox">
      <div class="meta"><span id="counter"></span><span id="known"></span></div>
      <div class="track"><div id="fill" class="bar"></div></div>

      <div id="scene" class="scene">
        <div id="card" class="flip">
          <div class="face front">
            <span id="badge" class="chip" hidden>Выучено</span>
            <div class="label">English</div>
            <div id="en" class="word"></div>
            <button id="sound" class="btn tonal"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>Послушать</button>
            <div class="hint">Нажмите, чтобы перевернуть</div>
          </div>
          <div class="face back">
            <div class="label">Перевод</div>
            <div id="ru" class="ru"></div>
            <div id="ex" class="ex"></div>
            <div id="exru" class="exru"></div>
            <button id="exSound" class="btn tonal"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>Послушать пример</button>
          </div>
        </div>
      </div>

      <div id="voiceMsg" class="msg"></div>

      <div id="controls">
        <div class="row">
          <button id="prev" class="btn tonal">Назад</button>
          <button id="skip" class="btn tonal">Пропустить</button>
        </div>
        <div class="row">
          <button id="learn" class="btn outlined">Ещё учу</button>
          <button id="know" class="btn filled">Знаю</button>
        </div>
      </div>

      <div id="end" class="panel end" hidden>
        <h2>Колода закончилась</h2>
        <p id="endText" class="sub"></p>
        <div class="row"><button id="again" class="btn filled">Повторить непонятные</button></div>
        <div class="row"><button id="restart" class="btn tonal">Сбросить и начать заново</button></div>
      </div>

      <div class="center"><button id="shuffle" class="btn text">Перемешать</button></div>
    </div>
  </section>

  <section id="panel-words" hidden>
    <p id="wordsTitle" class="title"></p>
    <div id="wordList"></div>

    <div class="panel">
      <p class="title">Новое слово</p>
      <input id="newEn" class="in" placeholder="Слово на английском" autocomplete="off">
      <input id="newRu" class="in" placeholder="Перевод на русский" autocomplete="off">
      <button id="addWordBtn" class="btn filled wide">Добавить</button>
      <div id="wordMsg" class="msg"></div>
    </div>

    <div class="panel">
      <p class="title">Новая колода</p>
      <input id="newDeck" class="in" placeholder="Название, например «Работа»" autocomplete="off">
      <button id="addDeckBtn" class="btn tonal wide">Создать колоду</button>
      <div class="center"><button id="delDeck" class="btn text red" hidden>Удалить эту колоду</button></div>
    </div>
  </section>

  <section id="panel-stats" hidden>
    <div class="grid3">
      <div class="stat"><b id="sumToday">0</b><span>сегодня</span></div>
      <div class="stat"><b id="sumAll">0</b><span>всего ответов</span></div>
      <div class="stat"><b id="sumStreak">0</b><span>дней подряд</span></div>
    </div>
    <p class="title">По колодам</p>
    <div id="deckStats"></div>
    <button id="resetDeck" class="btn tonal wide">Сбросить прогресс</button>
  </section>
</main>

<button id="fab" class="fab" hidden><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Добавить слово</button>

<nav class="nav">
  <button class="ni on" data-tab="study"><span class="pill"><svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg></span>Учить</button>
  <button class="ni" data-tab="words"><span class="pill"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>Слова</button>
  <button class="ni" data-tab="stats"><span class="pill"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></span>Статистика</button>
</nav>

<script>
const KEY = "flashcards-app-v1";

const BASE = [
  { en: "hello", ru: "привет", ex: "Hello, my friend!", exRu: "Привет, мой друг!" },
  { en: "book", ru: "книга", ex: "I like this book.", exRu: "Мне нравится эта книга." },
  { en: "house", ru: "дом", ex: "Our house is big.", exRu: "Наш дом большой." },
  { en: "water", ru: "вода", ex: "Can I have some water?", exRu: "Можно мне немного воды?" },
  { en: "friend", ru: "друг", ex: "She is my best friend.", exRu: "Она мой лучший друг." },
  { en: "school", ru: "школа", ex: "I go to school every day.", exRu: "Я хожу в школу каждый день." },
  { en: "family", ru: "семья", ex: "My family is big.", exRu: "Моя семья большая." },
  { en: "happy", ru: "счастливый", ex: "I am very happy today.", exRu: "Сегодня я очень счастлив(а)." },
  { en: "big", ru: "большой", ex: "The dog is big.", exRu: "Собака большая." },
  { en: "small", ru: "маленький", ex: "The cat is small.", exRu: "Кошка маленькая." },
  { en: "go", ru: "идти, ехать", ex: "Let's go home.", exRu: "Пойдём домой." },
  { en: "eat", ru: "есть, кушать", ex: "We eat dinner at seven.", exRu: "Мы ужинаем в семь." },
  { en: "sleep", ru: "спать", ex: "I sleep at night.", exRu: "Я сплю ночью." },
  { en: "work", ru: "работать", ex: "My mom works in an office.", exRu: "Моя мама работает в офисе." },
  { en: "money", ru: "деньги", ex: "I have no money.", exRu: "У меня нет денег." },
  { en: "time", ru: "время", ex: "What time is it?", exRu: "Который сейчас час?" },
  { en: "day", ru: "день", ex: "Have a nice day!", exRu: "Хорошего дня!" },
  { en: "night", ru: "ночь", ex: "Good night!", exRu: "Спокойной ночи!" },
  { en: "morning", ru: "утро", ex: "Good morning!", exRu: "Доброе утро!" },
  { en: "city", ru: "город", ex: "I live in a big city.", exRu: "Я живу в большом городе." },
  { en: "car", ru: "машина", ex: "My dad has a red car.", exRu: "У моего папы красная машина." },
  { en: "road", ru: "дорога", ex: "The road is long.", exRu: "Дорога длинная." },
  { en: "cat", ru: "кошка", ex: "The cat is sleeping.", exRu: "Кошка спит." },
  { en: "dog", ru: "собака", ex: "My dog likes to run.", exRu: "Моя собака любит бегать." },
  { en: "food", ru: "еда", ex: "This food is delicious.", exRu: "Эта еда очень вкусная." },
  { en: "weather", ru: "погода", ex: "The weather is nice today.", exRu: "Сегодня хорошая погода." },
  { en: "love", ru: "любить", ex: "I love music.", exRu: "Я люблю музыку." },
  { en: "learn", ru: "учить, учиться", ex: "I learn English every day.", exRu: "Я учу английский каждый день." },
  { en: "think", ru: "думать", ex: "I think so.", exRu: "Я так думаю." },
  { en: "thank you", ru: "спасибо", ex: "Thank you very much!", exRu: "Большое спасибо!" }
];

const $ = id => document.getElementById(id);
const webSpeechOK = "speechSynthesis" in window;

const todayKey = (d = new Date()) =>
  d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const defaultState = () => ({
  decks: [{ id: "base", name: "Базовые 30 слов", builtin: true, words: BASE.map(w => ({ ...w })) }],
  active: "base",
  known: {},
  history: {}
});

function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d && Array.isArray(d.decks) && d.decks.length) return d;
  } catch (e) {}
  return defaultState();
}

let S = loadState();
const saveState = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const deck = () => S.decks.find(d => d.id === S.active) || S.decks[0];
const knownSet = (d = deck()) => new Set(S.known[d.id] || []);
const countKnown = d => { const s = knownSet(d); return d.words.filter(w => s.has(w.en)).length; };

function setKnown(en, on) {
  const d = deck(), s = knownSet(d);
  if (on) s.add(en); else s.delete(en);
  S.known[d.id] = [...s];
}

function logAnswer() {
  const k = todayKey();
  S.history[k] = (S.history[k] || 0) + 1;
}

function streak() {
  const d = new Date();
  if (!S.history[todayKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (S.history[todayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Озвучка ----------
   Сначала пробуем голос телефона через мост из MainActivity.
   Если его нет, пробуем встроенную озвучку браузера.
   Возвращает true, если озвучка запущена. */
function speak(text) {
  if (window.AndroidTTS) {
    try { AndroidTTS.speak(text); return true; } catch (e) {}
  }
  if (!webSpeechOK) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
  return true;
}

function say(text) {
  const ok = speak(text);
  $("voiceMsg").textContent = ok ? "" : "Озвучка недоступна. Нужна новая версия приложения.";
}

/* ---------- Учить ---------- */

let order = [], pos = 0, flipped = false;

function setFlip(v) {
  flipped = v;
  $("card").classList.toggle("on", v);
}

function startRound(list) {
  order = shuffle(list || deck().words);
  pos = 0;
  setFlip(false);
  renderAll();
}

function renderStudy() {
  const d = deck(), empty = !d.words.length;
  $("noWords").hidden = !empty;
  $("studyBox").hidden = empty;
  if (empty) return;

  const done = pos >= order.length, kn = countKnown(d);
  $("controls").hidden = done;
  $("scene").hidden = done;
  $("end").hidden = !done;
  $("shuffle").hidden = done;
  $("known").textContent = `Знаю: ${kn} из ${d.words.length}`;
  $("fill").style.width = (order.length ? pos / order.length * 100 : 0) + "%";

  if (done) {
    const left = d.words.length - kn;
    $("counter").textContent = `Готово: ${order.length} из ${order.length}`;
    $("endText").textContent = left
      ? `Пока не выучили: ${left}. Можно повторить только их.`
      : "Все слова в колоде выучены!";
    $("again").hidden = !left;
    return;
  }

  const w = order[pos];
  setFlip(false);
  $("voiceMsg").textContent = "";
  $("counter").textContent = `Карточка ${pos + 1} из ${order.length}`;
  $("en").textContent = w.en;
  $("ru").textContent = w.ru;
  $("ex").textContent = w.ex || "";
  $("exru").textContent = w.exRu || "";
  $("exSound").hidden = !w.ex;
  $("badge").hidden = !knownSet(d).has(w.en);
}

function answer(k) {
  const w = order[pos];
  setKnown(w.en, k);
  logAnswer();
  saveState();
  pos++;
  renderAll();
}

/* ---------- Слова ---------- */

function renderWords() {
  const d = deck();
  $("wordsTitle").textContent = `${d.name}: ${d.words.length} слов`;
  $("delDeck").hidden = d.builtin;
  const list = $("wordList");
  list.textContent = "";
  if (!d.words.length) {
    const p = document.createElement("p");
    p.className = "sub";
    p.textContent = "Пока пусто. Добавьте первое слово.";
    list.appendChild(p);
  }
  d.words.forEach((w, i) => {
    const row = document.createElement("div");
    row.className = "item";
    const t = document.createElement("div");
    t.className = "txt";
    const b = document.createElement("b");
    b.textContent = w.en;
    t.append(b, document.createTextNode(" — " + w.ru));
    const x = document.createElement("button");
    x.className = "icon";
    x.textContent = "✕";
    x.setAttribute("aria-label", "Удалить слово");
    x.addEventListener("click", () => removeWord(i));
    row.append(t, x);
    list.appendChild(row);
  });
}

function addWord() {
  const en = $("newEn").value.trim(), ru = $("newRu").value.trim(), d = deck(), msg = $("wordMsg");
  if (!en || !ru) { msg.textContent = "Заполните оба поля."; return; }
  if (d.words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
    msg.textContent = "Такое слово уже есть в этой колоде.";
    return;
  }
  d.words.push({ en, ru });
  saveState();
  $("newEn").value = "";
  $("newRu").value = "";
  msg.textContent = "Слово добавлено";
  startRound();
}

function removeWord(i) {
  const d = deck(), en = d.words[i].en;
  d.words.splice(i, 1);
  S.known[d.id] = (S.known[d.id] || []).filter(x => x !== en);
  saveState();
  startRound();
}

function addDeck() {
  const name = $("newDeck").value.trim();
  if (!name) return;
  const id = "d" + Date.now();
  S.decks.push({ id, name, builtin: false, words: [] });
  S.active = id;
  $("newDeck").value = "";
  saveState();
  startRound();
}

let delArmed = null;
function delDeck() {
  const d = deck();
  if (d.builtin) return;
  const btn = $("delDeck");
  if (delArmed !== d.id) {
    delArmed = d.id;
    btn.textContent = "Нажмите ещё раз, чтобы удалить";
    setTimeout(() => {
      if (delArmed === d.id) { delArmed = null; btn.textContent = "Удалить эту колоду"; }
    }, 3000);
    return;
  }
  S.decks = S.decks.filter(x => x.id !== d.id);
  delete S.known[d.id];
  S.active = "base";
  delArmed = null;
  btn.textContent = "Удалить эту колоду";
  saveState();
  startRound();
}

/* ---------- Статистика ---------- */

function renderStats() {
  const box = $("deckStats");
  box.textContent = "";
  S.decks.forEach(d => {
    const kn = countKnown(d), t = d.words.length;
    const card = document.createElement("div");
    card.className = "panel";
    const n = document.createElement("div");
    n.className = "dname";
    n.textContent = d.name;
    const i = document.createElement("div");
    i.className = "small";
    i.style.margin = "4px 0 10px";
    i.textContent = `Знаю ${kn} из ${t}`;
    const tr = document.createElement("div");
    tr.className = "track";
    const f = document.createElement("div");
    f.className = "bar";
    f.style.width = (t ? kn / t * 100 : 0) + "%";
    tr.appendChild(f);
    card.append(n, i, tr);
    box.appendChild(card);
  });
  $("sumToday").textContent = S.history[todayKey()] || 0;
  $("sumAll").textContent = Object.values(S.history).reduce((a, b) => a + b, 0);
  $("sumStreak").textContent = streak();
  $("resetDeck").textContent = `Сбросить прогресс: ${deck().name}`;
}

/* ---------- Общее ---------- */

let tab = "study";

function showTab(t) {
  tab = t;
  document.querySelectorAll(".ni").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["study", "words", "stats"].forEach(n => { $("panel-" + n).hidden = n !== t; });
  $("fab").hidden = t !== "words";
  renderAll();
}

function renderSelect() {
  const s = $("deckSel");
  s.textContent = "";
  S.decks.forEach(d => {
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = `${d.name} (${d.words.length})`;
    s.appendChild(o);
  });
  s.value = deck().id;
}

function renderAll() {
  renderSelect();
  if (tab === "study") renderStudy();
  if (tab === "words") renderWords();
  if (tab === "stats") renderStats();
}

/* ---------- Обработчики ---------- */

document.querySelectorAll(".ni").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
$("deckSel").addEventListener("change", e => { S.active = e.target.value; saveState(); startRound(); });
$("card").addEventListener("click", () => setFlip(!flipped));
$("sound").addEventListener("click", e => { e.stopPropagation(); if (order[pos]) say(order[pos].en); });
$("exSound").addEventListener("click", e => { e.stopPropagation(); if (order[pos] && order[pos].ex) say(order[pos].ex); });
$("know").addEventListener("click", () => answer(true));
$("learn").addEventListener("click", () => answer(false));
$("skip").addEventListener("click", () => { pos++; renderAll(); });
$("prev").addEventListener("click", () => { if (pos > 0) pos--; renderAll(); });
$("shuffle").addEventListener("click", () => startRound());
$("again").addEventListener("click", () => {
  const d = deck(), k = knownSet(d);
  startRound(d.words.filter(w => !k.has(w.en)));
});
$("restart").addEventListener("click", () => { S.known[deck().id] = []; saveState(); startRound(); });
$("goWords").addEventListener("click", () => showTab("words"));
$("fab").addEventListener("click", () => { $("newEn").focus(); $("newEn").scrollIntoView({ block: "center" }); });
$("addWordBtn").addEventListener("click", addWord);
$("addDeckBtn").addEventListener("click", addDeck);
$("delDeck").addEventListener("click", delDeck);
$("resetDeck").addEventListener("click", () => { S.known[deck().id] = []; saveState(); renderAll(); });

startRound();
showTab("study");
</script>
</body>
</html>
