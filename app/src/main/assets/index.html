<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WordStreak</title>
<style>
:root{--bg:#E6E3F5;--sh1:#C2BFDA;--sh2:#FFFFFF;--acc:#5B54D8;--on:#FFFFFF;--txt:#2B2858;--mut:#6B6896;--red:#D2456B;color-scheme:light}
:root[data-theme="dark"]{--bg:#2D2B4E;--sh1:#201E3B;--sh2:#3B3965;--acc:#7F78F2;--on:#FFFFFF;--txt:#ECEAFF;--mut:#A9A6D4;--red:#FF7B98;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:400 16px/24px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit;color:inherit}
.n{background:var(--bg);border-radius:28px;box-shadow:8px 8px 16px var(--sh1),-8px -8px 16px var(--sh2)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 12px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font:700 22px/28px Roboto,system-ui,sans-serif}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);box-shadow:5px 5px 10px var(--sh1),-5px -5px 10px var(--sh2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.ib:active{box-shadow:inset 3px 3px 6px var(--sh1),inset -3px -3px 6px var(--sh2)}
.sel,.in{width:100%;height:52px;border:0;border-radius:16px;background:var(--bg);padding:0 16px;outline:none;font-size:16px;box-shadow:inset 4px 4px 8px var(--sh1),inset -4px -4px 8px var(--sh2)}
.in{margin-bottom:12px}
main{padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 130px)}
.btn{border:0;border-radius:20px;background:var(--bg);font:600 15px/20px Roboto,system-ui,sans-serif;padding:14px 22px;cursor:pointer;box-shadow:6px 6px 12px var(--sh1),-6px -6px 12px var(--sh2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{box-shadow:inset 4px 4px 8px var(--sh1),inset -4px -4px 8px var(--sh2)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.acc{background:var(--acc);color:var(--on)}
.btn.acc:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.3)}
.btn.red{color:var(--red)}
.btn.link{box-shadow:none;background:none;color:var(--acc)}
.btn.w{display:flex;width:100%}
.row{display:flex;gap:12px;margin-top:14px}
.row .btn{flex:1;padding:14px 8px}
.track{height:10px;border-radius:10px;background:var(--bg);box-shadow:inset 3px 3px 6px var(--sh1),inset -3px -3px 6px var(--sh2);overflow:hidden;margin:0 2px}
.fill{height:100%;width:0;border-radius:10px;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:8px 4px 12px}
.scene{perspective:1200px;margin:18px 0 10px}
.flip{position:relative;min-height:330px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.back{transform:rotateY(180deg)}
.lbl{font:600 12px/16px Roboto,system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.word{font:700 38px/46px Roboto,system-ui,sans-serif;word-break:break-word}
.ru{font:700 30px/38px Roboto,system-ui,sans-serif;color:var(--acc);word-break:break-word}
.ex{font-size:17px;line-height:24px}
.exru{font-size:14px;line-height:20px;color:var(--mut)}
.hint{font-size:12px;color:var(--mut)}
.chip{position:absolute;top:18px;right:18px;padding:6px 12px;border-radius:12px;background:var(--acc);color:var(--on);font:600 12px/16px Roboto,system-ui,sans-serif}
.msg{min-height:20px;margin-top:10px;text-align:center;font-size:14px;color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 12px 14px 18px;border-radius:22px;margin-bottom:14px}
.txt{min-width:0;overflow-wrap:anywhere}
.title{margin:22px 6px 10px;font:600 14px/20px Roboto,system-ui,sans-serif;color:var(--mut)}
.panel{padding:22px;margin-bottom:16px}
.panel>.title{margin:0 0 14px}
.sub{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:20px}
.small{font-size:13px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stat{padding:18px 8px;text-align:center;border-radius:24px}
.stat b{display:block;font:700 26px/32px Roboto,system-ui,sans-serif;color:var(--acc)}
.stat span{font-size:12px;line-height:16px;color:var(--mut)}
.dname{font:600 16px/22px Roboto,system-ui,sans-serif;margin-bottom:4px}
.end{text-align:center}
.end h2{margin:0 0 10px;font:700 24px/30px Roboto,system-ui,sans-serif}
.nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;display:flex;gap:10px;padding:10px;border-radius:30px;background:var(--bg);box-shadow:8px 8px 16px var(--sh1),-8px -8px 16px var(--sh2)}
.ni{flex:1;border:0;border-radius:22px;background:none;color:var(--mut);font:600 12px/16px Roboto,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;cursor:pointer}
.ni svg{width:24px;height:24px;fill:currentColor}
.ni.on{color:var(--acc);box-shadow:inset 4px 4px 8px var(--sh1),inset -4px -4px 8px var(--sh2)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);z-index:6}
</style>
</head>
<body>
<header class="top">
  <div class="hd">
    <h1>WordStreak</h1>
    <button id="themeBtn" class="ib" aria-label="Тема"></button>
  </div>
  <select id="deckSel" class="sel" aria-label="Колода"></select>
</header>

<main>
  <section id="panel-study">
    <div id="noWords" class="n panel" hidden>
      <p class="sub">В этой колоде пока нет слов.</p>
      <button id="goWords" class="btn acc w">Добавить слова</button>
    </div>

    <div id="studyBox">
      <div class="meta"><span id="counter"></span><span id="known"></span></div>
      <div class="track"><div id="fill" class="fill"></div></div>

      <div id="scene" class="scene">
        <div id="card" class="flip">
          <div class="n face front">
            <span id="badge" class="chip" hidden>Выучено</span>
            <div class="lbl">English</div>
            <div id="en" class="word"></div>
            <button id="sound" class="btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>Послушать</button>
            <div class="hint">Нажмите, чтобы перевернуть</div>
          </div>
          <div class="n face back">
            <div class="lbl">Перевод</div>
            <div id="ru" class="ru"></div>
            <div id="ex" class="ex"></div>
            <div id="exru" class="exru"></div>
            <button id="exSound" class="btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>Послушать пример</button>
          </div>
        </div>
      </div>

      <div id="voiceMsg" class="msg"></div>

      <div id="controls">
        <div class="row">
          <button id="prev" class="btn">Назад</button>
          <button id="skip" class="btn">Пропустить</button>
        </div>
        <div class="row">
          <button id="learn" class="btn red">Ещё учу</button>
          <button id="know" class="btn acc">Знаю</button>
        </div>
      </div>

      <div id="end" class="n panel end" hidden>
        <h2>Колода закончилась</h2>
        <p id="endText" class="sub"></p>
        <div class="row"><button id="again" class="btn acc w">Повторить непонятные</button></div>
        <div class="row"><button id="restart" class="btn w">Сбросить и начать заново</button></div>
      </div>

      <div style="text-align:center;margin-top:12px"><button id="shuffle" class="btn link">Перемешать</button></div>
    </div>
  </section>

  <section id="panel-words" hidden>
    <p id="wordsTitle" class="title"></p>
    <div id="wordList"></div>

    <div class="n panel">
      <p class="title">Новое слово</p>
      <input id="newEn" class="in" placeholder="Слово на английском" autocomplete="off">
      <input id="newRu" class="in" placeholder="Перевод на русский" autocomplete="off">
      <button id="addWordBtn" class="btn acc w">Добавить</button>
      <div id="wordMsg" class="msg"></div>
    </div>

    <div class="n panel">
      <p class="title">Новая колода</p>
      <input id="newDeck" class="in" placeholder="Название, например «Работа»" autocomplete="off">
      <button id="addDeckBtn" class="btn w">Создать колоду</button>
      <div style="text-align:center;margin-top:10px"><button id="delDeck" class="btn link red" hidden>Удалить эту колоду</button></div>
    </div>
  </section>

  <section id="panel-stats" hidden>
    <div class="grid3">
      <div class="n stat"><b id="sumToday">0</b><span>сегодня</span></div>
      <div class="n stat"><b id="sumAll">0</b><span>всего ответов</span></div>
      <div class="n stat"><b id="sumStreak">0</b><span>дней подряд</span></div>
    </div>
    <p class="title">По колодам</p>
    <div id="deckStats"></div>
    <button id="resetDeck" class="btn w">Сбросить прогресс</button>
  </section>
</main>

<button id="fab" class="btn acc fab" hidden><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Добавить слово</button>

<nav class="nav">
  <button class="ni on" data-tab="study"><svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>Учить</button>
  <button class="ni" data-tab="words"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Слова</button>
  <button class="ni" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>Статистика</button>
</nav>

<script>
const KEY = "flashcards-app-v1";
const THEME_KEY = "flashcards-theme";

const BASE = [
  { en: "hello", ru: "привет", ex: "Hello, my friend!", exRu: "Привет, мой друг!" },
  { en: "book", ru: "книга", ex: "I like this book.", exRu: "Мне нравится эта книга." },
  { en: "house", ru: "дом", ex: "Our house is big.", exRu: "Наш дом большой." },
  { en: "water", ru: "вода", ex: "Can I have some water?", exRu: "Можно мне немного воды?" },
  { en: "friend", ru: "друг", ex: "She is my best friend.", exRu: "Она мой лучший друг." },
  { en: "school", ru: "школа", ex: "I go to school every day.", exRu: "Я хожу в школу каждый день." },
  { en: "family", ru: "семья", ex: "My family is big.", exRu: "Моя семья большая." },
  { en: "happy", ru: "счастливый", ex: "I am very happy today.", exRu: "Сегодня я очень счастлив(а)." },
  { en: "big", ru: "большой", ex: "The dog is big.", exRu: "Собака большая." },
  { en: "small", ru: "маленький", ex: "The cat is small.", exRu: "Кошка маленькая." },
  { en: "go", ru: "идти, ехать", ex: "Let's go home.", exRu: "Пойдём домой." },
  { en: "eat", ru: "есть, кушать", ex: "We eat dinner at seven.", exRu: "Мы ужинаем в семь." },
  { en: "sleep", ru: "спать", ex: "I sleep at night.", exRu: "Я сплю ночью." },
  { en: "work", ru: "работать", ex: "My mom works in an office.", exRu: "Моя мама работает в офисе." },
  { en: "money", ru: "деньги", ex: "I have no money.", exRu: "У меня нет денег." },
  { en: "time", ru: "время", ex: "What time is it?", exRu: "Который сейчас час?" },
  { en: "day", ru: "день", ex: "Have a nice day!", exRu: "Хорошего дня!" },
  { en: "night", ru: "ночь", ex: "Good night!", exRu: "Спокойной ночи!" },
  { en: "morning", ru: "утро", ex: "Good morning!", exRu: "Доброе утро!" },
  { en: "city", ru: "город", ex: "I live in a big city.", exRu: "Я живу в большом городе." },
  { en: "car", ru: "машина", ex: "My dad has a red car.", exRu: "У моего папы красная машина." },
  { en: "road", ru: "дорога", ex: "The road is long.", exRu: "Дорога длинная." },
  { en: "cat", ru: "кошка", ex: "The cat is sleeping.", exRu: "Кошка спит." },
  { en: "dog", ru: "собака", ex: "My dog likes to run.", exRu: "Моя собака любит бегать." },
  { en: "food", ru: "еда", ex: "This food is delicious.", exRu: "Эта еда очень вкусная." },
  { en: "weather", ru: "погода", ex: "The weather is nice today.", exRu: "Сегодня хорошая погода." },
  { en: "love", ru: "любить", ex: "I love music.", exRu: "Я люблю музыку." },
  { en: "learn", ru: "учить, учиться", ex: "I learn English every day.", exRu: "Я учу английский каждый день." },
  { en: "think", ru: "думать", ex: "I think so.", exRu: "Я так думаю." },
  { en: "thank you", ru: "спасибо", ex: "Thank you very much!", exRu: "Большое спасибо!" }
];

const PACKS = [
  { id: "pack2", name: "Ещё 40 слов", words: [
    { en: "apple", ru: "яблоко", ex: "I eat an apple every day.", exRu: "Я ем яблоко каждый день." },
    { en: "bread", ru: "хлеб", ex: "Please give me some bread.", exRu: "Дайте, пожалуйста, хлеб." },
    { en: "milk", ru: "молоко", ex: "The baby drinks milk.", exRu: "Ребёнок пьёт молоко." },
    { en: "coffee", ru: "кофе", ex: "I want a cup of coffee.", exRu: "Я хочу чашку кофе." },
    { en: "tea", ru: "чай", ex: "Do you like green tea?", exRu: "Тебе нравится зелёный чай?" },
    { en: "breakfast", ru: "завтрак", ex: "What do you have for breakfast?", exRu: "Что ты ешь на завтрак?" },
    { en: "lunch", ru: "обед", ex: "Let's have lunch together.", exRu: "Давай пообедаем вместе." },
    { en: "dinner", ru: "ужин", ex: "Dinner is ready!", exRu: "Ужин готов!" },
    { en: "kitchen", ru: "кухня", ex: "My mom is in the kitchen.", exRu: "Мама на кухне." },
    { en: "bedroom", ru: "спальня", ex: "My bedroom is small.", exRu: "Моя спальня маленькая." },
    { en: "door", ru: "дверь", ex: "Close the door, please.", exRu: "Закройте дверь, пожалуйста." },
    { en: "window", ru: "окно", ex: "Open the window.", exRu: "Откройте окно." },
    { en: "table", ru: "стол", ex: "The book is on the table.", exRu: "Книга на столе." },
    { en: "chair", ru: "стул", ex: "Sit on the chair.", exRu: "Сядь на стул." },
    { en: "phone", ru: "телефон", ex: "My phone is new.", exRu: "Мой телефон новый." },
    { en: "computer", ru: "компьютер", ex: "I work on the computer.", exRu: "Я работаю за компьютером." },
    { en: "bag", ru: "сумка", ex: "My bag is heavy.", exRu: "Моя сумка тяжёлая." },
    { en: "shoes", ru: "обувь, туфли", ex: "My shoes are black.", exRu: "Мои туфли чёрные." },
    { en: "shirt", ru: "рубашка", ex: "He wears a white shirt.", exRu: "Он носит белую рубашку." },
    { en: "hat", ru: "шляпа", ex: "Nice hat!", exRu: "Классная шляпа!" },
    { en: "hand", ru: "рука, кисть", ex: "Wash your hands.", exRu: "Помойте руки." },
    { en: "head", ru: "голова", ex: "My head hurts.", exRu: "У меня болит голова." },
    { en: "eye", ru: "глаз", ex: "She has blue eyes.", exRu: "У неё голубые глаза." },
    { en: "mother", ru: "мама, мать", ex: "My mother is a doctor.", exRu: "Моя мама врач." },
    { en: "father", ru: "отец", ex: "My father likes football.", exRu: "Мой отец любит футбол." },
    { en: "brother", ru: "брат", ex: "I have a brother.", exRu: "У меня есть брат." },
    { en: "sister", ru: "сестра", ex: "My sister is older than me.", exRu: "Моя сестра старше меня." },
    { en: "boy", ru: "мальчик", ex: "The boy is playing.", exRu: "Мальчик играет." },
    { en: "girl", ru: "девочка", ex: "The girl is reading.", exRu: "Девочка читает." },
    { en: "man", ru: "мужчина", ex: "That man is my teacher.", exRu: "Тот мужчина — мой учитель." },
    { en: "woman", ru: "женщина", ex: "The woman is kind.", exRu: "Женщина добрая." },
    { en: "teacher", ru: "учитель", ex: "Our teacher is funny.", exRu: "Наш учитель весёлый." },
    { en: "student", ru: "ученик, студент", ex: "I am a student.", exRu: "Я студент." },
    { en: "doctor", ru: "врач", ex: "The doctor is here.", exRu: "Врач здесь." },
    { en: "park", ru: "парк", ex: "We walk in the park.", exRu: "Мы гуляем в парке." },
    { en: "shop", ru: "магазин", ex: "The shop is open.", exRu: "Магазин открыт." },
    { en: "street", ru: "улица", ex: "The street is busy.", exRu: "Улица оживлённая." },
    { en: "bus", ru: "автобус", ex: "I take the bus to work.", exRu: "Я еду на работу на автобусе." },
    { en: "train", ru: "поезд", ex: "The train is fast.", exRu: "Поезд быстрый." },
    { en: "sun", ru: "солнце", ex: "The sun is hot today.", exRu: "Сегодня жарко, солнце печёт." }
  ] }
];

const $ = id => document.getElementById(id);
const webSpeechOK = "speechSynthesis" in window;

/* Тема */
const currentTheme = () => document.documentElement.getAttribute("data-theme") || "light";

function renderTheme() {
  const dark = currentTheme() === "dark";
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  $("themeBtn").setAttribute("aria-label", dark ? "Светлая тема" : "Тёмная тема");
}

function toggleTheme() {
  const t = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  renderTheme();
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", saved || (sys ? "dark" : "light"));
})();

/* Данные */
const todayKey = (d = new Date()) =>
  d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const defaultState = () => ({
  decks: [{ id: "base", name: "Базовые 30 слов", builtin: true, words: BASE.map(w => ({ ...w })) }],
  active: "base",
  known: {},
  history: {}
});

function loadState() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!d || !Array.isArray(d.decks) || !d.decks.length) d = defaultState();
  PACKS.forEach(p => {
    if (!d.decks.some(x => x.id === p.id)) {
      d.decks.push({ id: p.id, name: p.name, builtin: true, words: p.words.map(w => ({ ...w })) });
    }
  });
  return d;
}

let S = loadState();
const saveState = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const deck = () => S.decks.find(d => d.id === S.active) || S.decks[0];
const knownSet = (d = deck()) => new Set(S.known[d.id] || []);
const countKnown = d => { const s = knownSet(d); return d.words.filter(w => s.has(w.en)).length; };

function setKnown(en, on) {
  const d = deck(), s = knownSet(d);
  if (on) s.add(en); else s.delete(en);
  S.known[d.id] = [...s];
}

function logAnswer() {
  const k = todayKey();
  S.history[k] = (S.history[k] || 0) + 1;
}

function streak() {
  const d = new Date();
  if (!S.history[todayKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (S.history[todayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Озвучка: голос телефона через мост из MainActivity, иначе встроенная озвучка браузера */
function speak(text) {
  if (window.AndroidTTS) {
    try { AndroidTTS.speak(text); return true; } catch (e) {}
  }
  if (!webSpeechOK) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
  return true;
}

function say(text) {
  $("voiceMsg").textContent = speak(text) ? "" : "Озвучка недоступна.";
}

/* Учить */
let order = [], pos = 0, flipped = false;

function setFlip(v) {
  flipped = v;
  $("card").classList.toggle("on", v);
}

function startRound(list) {
  order = shuffle(list || deck().words);
  pos = 0;
  setFlip(false);
  renderAll();
}

function renderStudy() {
  const d = deck(), empty = !d.words.length;
  $("noWords").hidden = !empty;
  $("studyBox").hidden = empty;
  if (empty) return;

  const done = pos >= order.length, kn = countKnown(d);
  $("controls").hidden = done;
  $("scene").hidden = done;
  $("end").hidden = !done;
  $("shuffle").hidden = done;
  $("known").textContent = `Знаю: ${kn} из ${d.words.length}`;
  $("fill").style.width = (order.length ? pos / order.length * 100 : 0) + "%";

  if (done) {
    const left = d.words.length - kn;
    $("counter").textContent = `Готово: ${order.length} из ${order.length}`;
    $("endText").textContent = left
      ? `Пока не выучили: ${left}. Можно повторить только их.`
      : "Все слова в колоде выучены!";
    $("again").hidden = !left;
    return;
  }

  const w = order[pos];
  setFlip(false);
  $("voiceMsg").textContent = "";
  $("counter").textContent = `Карточка ${pos + 1} из ${order.length}`;
  $("en").textContent = w.en;
  $("ru").textContent = w.ru;
  $("ex").textContent = w.ex || "";
  $("exru").textContent = w.exRu || "";
  $("exSound").hidden = !w.ex;
  $("badge").hidden = !knownSet(d).has(w.en);
}

function answer(k) {
  const w = order[pos];
  setKnown(w.en, k);
  logAnswer();
  saveState();
  pos++;
  renderAll();
}

/* Слова */
function renderWords() {
  const d = deck();
  $("wordsTitle").textContent = `${d.name}: ${d.words.length} слов`;
  $("delDeck").hidden = d.builtin;
  const list = $("wordList");
  list.textContent = "";
  if (!d.words.length) {
    const p = document.createElement("p");
    p.className = "sub";
    p.textContent = "Пока пусто. Добавьте первое слово.";
    list.appendChild(p);
  }
  d.words.forEach((w, i) => {
    const row = document.createElement("div");
    row.className = "n item";
    const t = document.createElement("div");
    t.className = "txt";
    const b = document.createElement("b");
    b.textContent = w.en;
    t.append(b, document.createTextNode(" — " + w.ru));
    const x = document.createElement("button");
    x.className = "ib";
    x.textContent = "✕";
    x.setAttribute("aria-label", "Удалить слово");
    x.addEventListener("click", () => removeWord(i));
    row.append(t, x);
    list.appendChild(row);
  });
}

function addWord() {
  const en = $("newEn").value.trim(), ru = $("newRu").value.trim(), d = deck(), msg = $("wordMsg");
  if (!en || !ru) { msg.textContent = "Заполните оба поля."; return; }
  if (d.words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
    msg.textContent = "Такое слово уже есть в этой колоде.";
    return;
  }
  d.words.push({ en, ru });
  saveState();
  $("newEn").value = "";
  $("newRu").value = "";
  msg.textContent = "Слово добавлено";
  startRound();
}

function removeWord(i) {
  const d = deck(), en = d.words[i].en;
  d.words.splice(i, 1);
  S.known[d.id] = (S.known[d.id] || []).filter(x => x !== en);
  saveState();
  startRound();
}

function addDeck() {
  const name = $("newDeck").value.trim();
  if (!name) return;
  const id = "d" + Date.now();
  S.decks.push({ id, name, builtin: false, words: [] });
  S.active = id;
  $("newDeck").value = "";
  saveState();
  startRound();
}

let delArmed = null;
function delDeck() {
  const d = deck();
  if (d.builtin) return;
  const btn = $("delDeck");
  if (delArmed !== d.id) {
    delArmed = d.id;
    btn.textContent = "Нажмите ещё раз, чтобы удалить";
    setTimeout(() => {
      if (delArmed === d.id) { delArmed = null; btn.textContent = "Удалить эту колоду"; }
    }, 3000);
    return;
  }
  S.decks = S.decks.filter(x => x.id !== d.id);
  delete S.known[d.id];
  S.active = "base";
  delArmed = null;
  btn.textContent = "Удалить эту колоду";
  saveState();
  startRound();
}

/* Статистика */
function renderStats() {
  const box = $("deckStats");
  box.textContent = "";
  S.decks.forEach(d => {
    const kn = countKnown(d), t = d.words.length;
    const card = document.createElement("div");
    card.className = "n panel";
    const n = document.createElement("div");
    n.className = "dname";
    n.textContent = d.name;
    const i = document.createElement("div");
    i.className = "small";
    i.style.margin = "4px 0 12px";
    i.textContent = `Знаю ${kn} из ${t}`;
    const tr = document.createElement("div");
    tr.className = "track";
    const f = document.createElement("div");
    f.className = "fill";
    f.style.width = (t ? kn / t * 100 : 0) + "%";
    tr.appendChild(f);
    card.append(n, i, tr);
    box.appendChild(card);
  });
  $("sumToday").textContent = S.history[todayKey()] || 0;
  $("sumAll").textContent = Object.values(S.history).reduce((a, b) => a + b, 0);
  $("sumStreak").textContent = streak();
  $("resetDeck").textContent = `Сбросить прогресс: ${deck().name}`;
}

/* Общее */
let tab = "study";

function showTab(t) {
  tab = t;
  document.querySelectorAll(".ni").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["study", "words", "stats"].forEach(n => { $("panel-" + n).hidden = n !== t; });
  $("fab").hidden = t !== "words";
  renderAll();
}

function renderSelect() {
  const s = $("deckSel");
  s.textContent = "";
  S.decks.forEach(d => {
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = `${d.name} (${d.words.length})`;
    s.appendChild(o);
  });
  s.value = deck().id;
}

function renderAll() {
  renderSelect();
  if (tab === "study") renderStudy();
  if (tab === "words") renderWords();
  if (tab === "stats") renderStats();
}

/* Обработчики */
document.querySelectorAll(".ni").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
$("themeBtn").addEventListener("click", toggleTheme);
$("deckSel").addEventListener("change", e => { S.active = e.target.value; saveState(); startRound(); });
$("card").addEventListener("click", () => setFlip(!flipped));
$("sound").addEventListener("click", e => { e.stopPropagation(); if (order[pos]) say(order[pos].en); });
$("exSound").addEventListener("click", e => { e.stopPropagation(); if (order[pos] && order[pos].ex) say(order[pos].ex); });
$("know").addEventListener("click", () => answer(true));
$("learn").addEventListener("click", () => answer(false));
$("skip").addEventListener("click", () => { pos++; renderAll(); });
$("prev").addEventListener("click", () => { if (pos > 0) pos--; renderAll(); });
$("shuffle").addEventListener("click", () => startRound());
$("again").addEventListener("click", () => {
  const d = deck(), k = knownSet(d);
  startRound(d.words.filter(w => !k.has(w.en)));
});
$("restart").addEventListener("click", () => { S.known[deck().id] = []; saveState(); startRound(); });
$("goWords").addEventListener("click", () => showTab("words"));
$("fab").addEventListener("click", () => { $("newEn").focus(); $("newEn").scrollIntoView({ block: "center" }); });
$("addWordBtn").addEventListener("click", addWord);
$("addDeckBtn").addEventListener("click", addDeck);
$("delDeck").addEventListener("click", delDeck);
$("resetDeck").addEventListener("click", () => { S.known[deck().id] = []; saveState(); renderAll(); });

renderTheme();
startRound();
showTab("study");
</script>
</body>
</html>
